# TEMPORARY – removed before the M1 pull request is opened.
# Claude's work environment cannot install packages, so the first pnpm-lock.yaml is generated here
# and committed back to the branch.
name: Lockfile bootstrap

on:
  push:
    branches: ["m1/**"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate and commit pnpm-lock.yaml
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pnpm-lock.yaml exists"; exit 0; fi
          pnpm install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate pnpm-lock.yaml"
          git push
